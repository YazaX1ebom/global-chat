<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Глобальный веб-чат</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 8px; }
        .input-group { display: flex; gap: 10px; }
        input, button { padding: 10px; font-size: 16px; }
        #messageInput { flex-grow: 1; }
    </style>
</head>
<body>

    <h2>Глобальный чат</h2>
    <div id="chat"></div>

    <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Твое имя" style="width: 120px;" />
        <input type="text" id="messageInput" placeholder="Введите сообщение..." />
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        // Подключаемся к вашему реальному серверу на Render
        const ws = new WebSocket('wss://global-chat-utz6.onrender.com');
        const chatDiv = document.getElementById('chat');

        // Функция для вывода сообщения на экран
        function displayMessage(text) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = text;
            chatDiv.appendChild(messageElement);
            chatDiv.scrollTop = chatDiv.scrollHeight; // Автопрокрутка вниз
        }

        ws.onmessage = (event) => {
            const packet = JSON.parse(event.data);

            if (packet.type === 'history') {
                // При входе выводим всю прошлую историю
                packet.data.forEach(msg => {
                    displayMessage(msg);
                });
            } else if (packet.type === 'message') {
                // Новое сообщение в реальном времени
                displayMessage(packet.data);
            }
        };

        function sendMessage() {
            const nameInput = document.getElementById('usernameInput');
            const messageInput = document.getElementById('messageInput');

            const name = nameInput.value.trim() || 'Аноним';
            const text = messageInput.value.trim();

            if (!text) return;

            // Отправляем имя и текст на сервер с проверкой состояния WebSocket
            const fullMessage = `${name}: ${text}`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(fullMessage);
                messageInput.value = '';
            } else {
                console.error('Соединение с сервером потеряно. Переподключитесь.');
                alert('Соединение с сервером не установлено или потеряно. Подождите пару секунд (сервер может просыпаться) или перезагрузите страницу.');
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

</body>
</html>
